[project]
name = "skinvision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
notebook = "skinvision.notebook:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
