[project]
name = "skinvision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "grad-cam>=1.5.7",
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "segmentation-models-pytorch>=0.6.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 140

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
